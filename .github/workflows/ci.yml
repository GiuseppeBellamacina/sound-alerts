name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Some security setups skip the classic hooks without a word: a plugin that depended on one would stop working.
      - name: No classic hooks
        shell: pwsh
        run: |
          $hits = Select-String -Path hooks/*.ts, hooks/*.tsx -Pattern 'classic\.'
          if ($hits) {
            $hits | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }

      - name: The Windows scripts parse
        shell: pwsh
        run: |
          foreach ($file in 'play.ps1', 'mode.ps1') {
            $errors = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/$file", [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | ForEach-Object { "${file}: $($_.Message)" }; exit 1 }
          }

      # A runner has no sound card: the script must still answer one line.
      - name: The Windows player
        shell: powershell
        run: ./tests/windows/play.test.ps1

      - name: The script that reads the permission mode
        shell: powershell
        run: ./tests/windows/mode.test.ps1

      - name: The bundled presets are complete and valid
        run: python tests/presets.test.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # A name Claude Code reserves or ships is only a warning for a command, but the command is then never registered.
      - name: Validate
        shell: pwsh
        run: |
          $output = claude plugin validate . 2>&1 | Out-String
          $output
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($output -match 'is a name Claude Code ships') { Write-Error 'A command name is one Claude Code ships: rename it.'; exit 1 }

      - name: Test
        run: claude plugin test .

  # The player for macOS and Linux, against stand-ins for the system's players, on both systems.
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          command -v shellcheck > /dev/null || brew install shellcheck
          shellcheck scripts/*.sh tests/unix/*.sh

      - name: The player against stand-ins
        run: bash tests/unix/play.test.sh

      - name: The script that reads the permission mode
        run: bash tests/unix/mode.test.sh
